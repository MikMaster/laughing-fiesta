name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir paquete del proyecto
        run: |
          ZIP_FILE=$(ls -1 *.zip | head -n 1)
          echo "Descomprimiendo $ZIP_FILE"
          unzip -o "$ZIP_FILE" -x ".github/*"

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Aplicar icono personalizado
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-icons/* android/app/src/main/res/

      - name: Sincronizar archivos web offline
        run: npx cap sync android

      - name: Compilar APK instalable
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renombrar APK final
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Calculadora-Mediania.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-Mediania-APK
          path: Calculadora-Mediania.apk
          retention-days: 30
